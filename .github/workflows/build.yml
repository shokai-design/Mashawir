name: Build Mashawir APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Mashawir project
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP" || {
            echo "ERROR: No ZIP file found."
            exit 1
          }

          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          ROOT="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ]; then
            ROOT="$(find project -type f -name build.gradle -print -quit | xargs -r dirname)"
          fi

          test -n "$ROOT" || {
            echo "ERROR: Gradle project was not found."
            exit 1
          }

          echo "Gradle project found at: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin JVM target
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          python3 - <<'PY'
          from pathlib import Path

          for p in Path(".").rglob("*.gradle"):
              text = p.read_text()

              if "kotlinOptions" in text:
                  text = text.replace(
                      'kotlinOptions {',
                      'kotlinOptions { jvmTarget = "17"'
                  )

              p.write_text(text)
          PY

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          gradle assembleDebug \
            -Dkotlin.jvm.target.validation.mode=ignore \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mashawir-debug-apk
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
